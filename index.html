<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aulas</title>
<style>
:root{
  --bg:#f4f5f7; --surface:#fff; --fg:#16202a; --muted:#5b6672; --line:#d9dee4; --accent:#2c6fd4;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141a; --surface:#18202a; --fg:#e6ebf0; --muted:#97a3af; --line:#2a3440; --accent:#6aa2ff;
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--fg);
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
nav{display:flex;gap:8px;align-items:center;padding:10px 16px;background:var(--surface);
  border-bottom:1px solid var(--line);overflow-x:auto}
nav strong{margin-right:8px;color:var(--muted);font-weight:600;white-space:nowrap}
nav a{padding:8px 14px;border-radius:8px;border:1px solid var(--line);color:var(--fg);
  text-decoration:none;white-space:nowrap}
nav a:hover{border-color:var(--accent)}
nav a[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:#fff}
iframe{flex:1;width:100%;border:0;background:#fff}
</style>
</head>
<body>
<nav>
  <strong>Aulas</strong>
  <a href="#clique" data-src="clique.html">1 · O caminho de um clique</a>
  <a href="#viagem" data-src="Quanto%20tempo%20leva%20uma%20viagem_.html">2 · Quanto tempo leva uma viagem?</a>
  <a href="#por-dentro" data-src="Por%20dentro%20da%20internet.html">3 · Por dentro da internet</a>
</nav>
<iframe id="aula" title="Aula"></iframe>
<script>
const links = [...document.querySelectorAll('nav a')];
const frame = document.getElementById('aula');
function show(){
  const link = links.find(a => a.hash === location.hash) || links[0];
  links.forEach(a => a === link ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current'));
  if (frame.getAttribute('src') !== link.dataset.src) frame.src = link.dataset.src;
}
addEventListener('hashchange', show);
show();
</script>
</body>
</html>
