<style>
/* Layout: título da aula → palco 16:9 (o "vídeo") → controles → lista de cenas com minutagem para a locução */
:root{
  --bg:#F2F6F7; --surface:#FFFFFF; --fg:#12303A; --muted:#52707A; --line:#D3E0E4; --accent:#C2412D; --chip:#E6EEF0;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  /* palco: paleta fixa, é o "vídeo" */
  --ink:#12303A; --amber:#FFC83D; --coral:#E2604A; --sea:#2E7F98; --deep:#0B2A3A; --leaf:#2FA37A;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1C22; --surface:#13272F; --fg:#E4EFF1; --muted:#93ADB5; --line:#23404A; --accent:#F28B72; --chip:#1B333C; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1C22; --surface:#13272F; --fg:#E4EFF1; --muted:#93ADB5; --line:#23404A; --accent:#F28B72; --chip:#1B333C; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:28px 56px;display:grid;gap:20px}
header{display:grid;gap:6px}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,4vw,42px);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0}

.stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;background:#0B2A3A;container-type:inline-size;box-shadow:0 1px 0 var(--line),0 18px 40px -24px rgba(10,40,50,.45)}
.stage svg{display:block;width:100%;height:100%}
.stage:fullscreen{border-radius:0;aspect-ratio:auto;width:100vw;height:100vh;background:#000}
.chipsec{position:absolute;top:3%;left:2.5%;background:rgba(255,255,255,.88);color:#12303A;font-weight:700;font-size:clamp(10px,1.35cqw,17px);padding:.35em .8em;border-radius:99px;letter-spacing:.02em;pointer-events:none}
.cap{position:absolute;left:50%;bottom:3.5%;transform:translateX(-50%);width:max-content;max-width:88%;background:rgba(6,22,29,.82);color:#fff;font-size:clamp(12px,2.05cqw,27px);line-height:1.35;padding:.45em .9em;border-radius:.5em;text-align:center;text-wrap:balance;pointer-events:none}
.cap:empty{display:none}
.bigplay{position:absolute;inset:0;margin:auto;width:clamp(64px,11cqw,120px);height:clamp(64px,11cqw,120px);border-radius:50%;border:0;background:#12303A;color:#FFC83D;cursor:pointer;display:grid;place-items:center;box-shadow:0 0 0 .5cqw rgba(255,255,255,.6)}
.bigplay svg{width:42%;height:42%;margin-left:8%}
.bigplay:focus-visible{outline:3px solid #FFC83D;outline-offset:4px}

.controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px}
.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-height:40px}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg);min-width:104px;justify-content:center}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:96px}
.track{position:relative;flex:1 1 260px;min-width:0;display:flex;align-items:center}
.track input{width:100%;accent-color:var(--accent);margin:0;height:28px}
.ticks{position:absolute;inset:0;pointer-events:none}
.ticks i{position:absolute;top:50%;width:2px;height:12px;margin-top:-6px;background:var(--muted);opacity:.45}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer}
.toggle input{accent-color:var(--accent);width:18px;height:18px}

.scenes h2{font-family:var(--f-display);font-size:22px;margin:8px 0 4px}
.scenes p.hint{margin:0 0 12px;color:var(--muted);font-size:14px}
.sec{display:grid;gap:6px;margin-bottom:18px}
.sec h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.sc{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);min-width:0}
.sc:hover{border-color:var(--muted)}
.sc:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sc .tc{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);grid-row:span 2;padding-top:2px}
.sc b{font-size:15px;min-width:0}
.sc span{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0}
.sc[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.sc[aria-current="true"] .tc{color:var(--accent);font-weight:700}

/* ---------- textos do palco ---------- */
.h1s{font-family:var(--f-display);font-weight:800;font-size:88px;fill:#12303A;letter-spacing:-1px}
.h2s{font-family:var(--f-display);font-weight:800;font-size:60px;fill:#12303A}
.lbl{font-family:var(--f-body);font-weight:700;font-size:30px;fill:#12303A}
.lbl.s{font-size:24px}
.lbl.w{fill:#FFFFFF}
.lbl.am{fill:#FFC83D}
.lbl.dk{fill:#8A4F00}
.soft{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:58px;fill:#6E98A8}
.heavy{font-family:var(--f-display);font-weight:800;font-size:66px;fill:#12303A}
.qm{font-family:var(--f-display);font-weight:800;font-size:190px;fill:#FFC83D;stroke:#12303A;stroke-width:6;paint-order:stroke}
.mid{text-anchor:middle}
.end{text-anchor:end}

/* ---------- animações (controladas pelo relógio do player) ---------- */
.a{animation-duration:.8s;animation-delay:var(--d,0s);animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.8,.2,1);transform-box:fill-box;transform-origin:center}
.fade{animation-name:fade}
.up{animation-name:up}
.pop{animation-name:pop;animation-duration:.7s}
.stamp{animation-name:stamp;animation-duration:.45s;animation-timing-function:cubic-bezier(.3,0,.3,1)}
.draw{animation-name:draw;animation-duration:var(--len,1.6s);animation-timing-function:ease-in-out;stroke-dasharray:1 2}
.dim{animation-name:dim}
.out{animation-name:out;animation-duration:.6s}
.fio{animation-name:fade,out;animation-duration:.8s,.6s;animation-delay:var(--d,0s),var(--d2,999s)}
.drop{animation-name:drop;animation-duration:1s;animation-timing-function:linear}
.sail{animation-name:sail;animation-duration:3s;animation-timing-function:cubic-bezier(.15,.7,.3,1)}
.press{animation-name:press;animation-duration:.4s}
.sweep{animation-name:sweep;animation-duration:.9s;animation-timing-function:linear;transform-origin:50% 100%}
.float{animation:float 4s ease-in-out var(--d,0s) infinite both;transform-box:fill-box}
.bob{animation:bob 3.2s ease-in-out var(--d,0s) infinite both;transform-box:fill-box;transform-origin:center}
.ring{animation:ring 1.8s ease-out var(--d,0s) infinite both;transform-box:fill-box;transform-origin:center}
.ring3{animation:ring 1.6s ease-out var(--d,0s) 3 both;transform-box:fill-box;transform-origin:center}
.blink{animation:blink .5s steps(1) var(--d,0s) infinite both}
.glow{animation:glow 1.4s ease-in-out var(--d,0s) infinite both;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.5s linear var(--d,0s) infinite both}
.swim{animation:swim 18s linear var(--d,0s) infinite both}
.wiggle{animation:wiggle .9s ease-in-out var(--d,0s) infinite both;transform-box:fill-box;transform-origin:center}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1.07)}100%{opacity:1;transform:scale(1)}}
@keyframes stamp{0%{opacity:0;transform:scale(1.8)}100%{opacity:1;transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:1.05}to{stroke-dashoffset:0}}
@keyframes dim{from{opacity:1}to{opacity:.28}}
@keyframes out{from{opacity:1}to{opacity:0}}
@keyframes drop{0%{transform:none;animation-timing-function:cubic-bezier(.55,0,1,.45)}70%{transform:translateY(184px)}82%{transform:translateY(168px)}100%{transform:translateY(184px)}}
@keyframes sail{from{transform:translateX(-1000px)}to{transform:none}}
@keyframes press{0%,100%{transform:scale(1)}50%{transform:scale(.82)}}
@keyframes sweep{from{transform:rotate(0)}to{transform:rotate(330deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(8px) rotate(1.2deg)}}
@keyframes ring{0%{opacity:0;transform:scale(.25)}15%{opacity:.9}100%{opacity:0;transform:scale(1)}}
@keyframes blink{0%{opacity:1}50%{opacity:.15}}
@keyframes glow{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.18)}}
@keyframes flow{0%{opacity:0;transform:translateX(0)}6%{opacity:1}94%{opacity:1}100%{opacity:0;transform:translateX(1290px)}}
@keyframes swim{from{transform:translateX(0)}to{transform:translateX(-2000px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
</style>

  </section>
</div>

<script>
const DATA = [
 {sec:"Provocando a reflexão inicial", name:"Onde está a internet?", text:"Olá, estudantes! Vamos começar com uma pergunta que parece simples: onde está a internet agora? Se pedíssemos para alguém apontar para a internet, para onde essa pessoa apontaria? Para o céu? Para o roteador? Para o celular?"},
 {sec:"Provocando a reflexão inicial", name:"A ideia de nuvem", text:"Muita gente responde “está na nuvem”. E a palavra nuvem faz a gente imaginar algo leve, flutuando no céu, invisível. Mas hoje vamos descobrir que a internet é muito mais pesada, concreta e surpreendente do que uma nuvem."},
 {sec:"Provocando a reflexão inicial", name:"Lia e Theo", text:"Para essa investigação, vamos ter companhia. Esta é a Lia. Ela mora em Fortaleza e quer mandar uma foto para o primo Theo, que mora em Lisboa, do outro lado do oceano. Vamos seguir essa foto e descobrir por onde ela passa."},
 {sec:"Acompanhando os primeiros passos da foto", name:"Do celular ao roteador", text:"Então, a Lia tira a foto, escolhe o Theo na lista de conversas e aperta “enviar”. O primeiro trecho da viagem é curtinho: a foto sai do celular como uma onda invisível, parecida com as ondas do rádio, e vai até o roteador de Wi-Fi da casa dela. Se ela estiver na rua, usando os dados móveis, essa onda vai até uma antena, aquelas torres altas que vemos em cima de prédios e morros."},
 {sec:"Acompanhando os primeiros passos da foto", name:"Do ar para o fio", text:"Até aqui, a viagem foi pelo ar. Mas é só o comecinho. Do roteador em diante, a foto entra em um fio. E a partir desse ponto, quase toda a viagem acontece dentro de cabos."},
 {sec:"Viajando pelos cabos da cidade", name:"Riachos que viram rio", text:"Esse fio sai da casa da Lia e se junta a outros fios, de outras casas, como riachos que se juntam para formar um rio. Os fios correm pelos postes e por baixo das ruas até chegar à empresa que vende a internet para a família dela."},
 {sec:"Viajando pelos cabos da cidade", name:"Fibra óptica", text:"Muitos desses cabos são feitos de fibra óptica. Imaginem um fio de vidro mais fino que um fio de cabelo, por onde a informação viaja como luz. É como se alguém, lá no começo do fio, piscasse uma lanterna muito rápido, acendendo e apagando milhões de vezes por segundo. Cada piscada carrega um pedacinho da foto. E a luz viaja tão rápido que conseguiria dar várias voltas no Brasil no tempo de um piscar de olhos."},
 {sec:"Chegando ao litoral", name:"Um oceano no caminho", text:"Agora vem o grande desafio: o Theo está em Portugal. Entre Fortaleza e Lisboa existe um oceano inteiro. Como a foto atravessa o Atlântico?"},
 {sec:"Chegando ao litoral", name:"Satélite ou cabo?", text:"Muita gente imagina que é por satélite. Satélites existem e ajudam em lugares muito isolados, mas a resposta principal é outra, e bem mais surpreendente: quase toda a informação que viaja entre continentes passa por cabos colocados no fundo do mar. São os cabos submarinos."},
 {sec:"Chegando ao litoral", name:"Fortaleza, porta dos cabos", text:"E aqui vai uma curiosidade sobre a nossa região: Fortaleza é um dos lugares do Brasil onde mais chegam cabos submarinos. Ou seja, muita informação que entra e sai do país passa pela praia de uma cidade do Nordeste. Um desses cabos liga justamente Fortaleza a Portugal, e é por ele que a foto da Lia pode viajar."},
 {sec:"Mergulhando com o cabo submarino", name:"Por dentro do cabo", text:"Como é um cabo desses? Perto da praia, ele é grosso e protegido por camadas de metal, porque ali corre mais risco: âncoras de navio, redes de pesca, pedras. Já no fundo do oceano, onde quase nada chega, ele pode ser fino, mais ou menos da grossura de uma mangueira de jardim. E lá dentro, no centro, estão aqueles fios de vidro por onde a luz corre."},
 {sec:"Mergulhando com o cabo submarino", name:"No fundo do mar", text:"Esse cabo atravessa milhares de quilômetros pelo fundo do mar, passando por planícies escuras, montanhas submarinas e peixes que nunca viram a luz do sol. E, ao longo do caminho, existem pequenos aparelhos que dão um “empurrãozinho” na luz, para que ela não fique fraca demais antes de chegar ao outro lado."},
 {sec:"Mergulhando com o cabo submarino", name:"O navio de reparo", text:"E se o cabo quebrar? Existem navios especializados em consertar cabos. Eles localizam o ponto do problema, puxam o cabo até a superfície, fazem o reparo no próprio navio e devolvem o cabo para o fundo do mar."},
 {sec:"Revelando o que é a “nuvem”", name:"Chegada em Lisboa", text:"Do outro lado, em Portugal, o cabo sai do mar, entra na terra, segue por mais fios e chega até o celular do Theo. Toda essa viagem, que parece um filme de aventura, acontece em menos de um segundo."},
 {sec:"Revelando o que é a “nuvem”", name:"A nuvem tem pés", text:"Então, voltando à nossa pergunta: onde está a internet? Ela está nos fios dos postes, nas antenas, nos cabos debaixo das ruas, nos prédios cheios de computadores e no fundo do mar. A nuvem, na verdade, tem os pés no chão. Ou melhor, no fundo do oceano."},
 {sec:"Revelando o que é a “nuvem”", name:"A próxima pergunta", text:"E isso traz uma nova pergunta, que vamos investigar nas próximas aulas: se a internet é feita de coisas tão concretas, quem constrói, quem cuida e quem paga por tudo isso? Até a próxima aula!"}
];
const WPS = 2.55, LEAD = .6, GAP = .35, TAIL = 1.1;

// ---------- montar a linha do tempo ----------
let T = 0;
DATA.forEach((s,i)=>{
  s.sent = s.text.match(/[^.!?]+[.!?]+[”"]?/g).map(x=>x.trim());
  s.st=[]; s.du=[];
  let c = LEAD;
  s.sent.forEach(x=>{ const d = x.split(/\s+/).length / WPS + .25; s.st.push(c); s.du.push(d); c += d + GAP; });
  s.dur = c + TAIL; s.start = T; T += s.dur;
  s.el = document.getElementById('sc'+i);
  s.el.style.display = 'none';
  const at = (el, k) => {
    const si = +(el.dataset['s'+k] ?? 0), f = +(el.dataset['f'+k] ?? 0), o = +(el.dataset['o'+k] ?? 0);
    return (s.st[si] ?? 0) + f*(s.du[si] ?? 0) + o;
  };
  s.el.querySelectorAll('[data-s]').forEach(el=>{
    if (el.classList.contains('trav')) return;
    el.style.setProperty('--d', at(el,'').toFixed(2)+'s');
    if (el.dataset.s2 !== undefined) el.style.setProperty('--d2', at(el,'2').toFixed(2)+'s');
  });
  s.trav = [...s.el.querySelectorAll('.trav')].map(el=>{
    const p = document.getElementById(el.dataset.path);
    return { el, p, len: 0, start: at(el,''), dur:+el.dataset.dur,
      loop: !!el.dataset.loop, gap:+(el.dataset.gap||0),
      rep: el.dataset.rep ? el.dataset.rep.split(',').map(Number) : null };
  });
});
const TOTAL = T;

// anéis de blindagem do cabo
document.querySelectorAll('[data-ring]').forEach(g=>{
  const [n,R,r,fill] = g.dataset.ring.split(',');
  for(let k=0;k<+n;k++){ const a = k/ n*Math.PI*2;
    const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',(Math.cos(a)*R).toFixed(1)); c.setAttribute('cy',(Math.sin(a)*R).toFixed(1));
    c.setAttribute('r',r); c.setAttribute('fill',fill); c.setAttribute('stroke','#4B575C'); c.setAttribute('stroke-width','2');
    g.appendChild(c); }
});

// ---------- UI ----------
const $ = id => document.getElementById(id);
const fmt = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
$('scrub').max = TOTAL.toFixed(2);
$('meta').textContent = `Motion narrado · ${DATA.length} cenas · ${fmt(TOTAL)} de duração`;
DATA.forEach(s=>{ const i = document.createElement('i'); i.style.left = (s.start/TOTAL*100)+'%'; $('ticks').appendChild(i); });

const chapWrap = $('chapters'); let secEl = null, lastSec = null;
DATA.forEach((s,i)=>{
  if (s.sec !== lastSec){ lastSec = s.sec; secEl = document.createElement('div'); secEl.className='sec';
    secEl.innerHTML = `<h3></h3><div class="list"></div>`; secEl.querySelector('h3').textContent = s.sec; chapWrap.appendChild(secEl); }
  const b = document.createElement('button'); b.className='sc'; b.type='button';
  b.innerHTML = `<span class="tc"></span><b></b><span></span>`;
  b.children[0].textContent = fmt(s.start); b.children[1].textContent = s.name; b.children[2].textContent = s.sent[0];
  b.addEventListener('click',()=>{ started = true; $('bigplay').hidden = true; t = s.start + .01; render(); $('stage').scrollIntoView({behavior:'smooth',block:'nearest'}); });
  s.btn = b; secEl.querySelector('.list').appendChild(b);
});

let t = 0, cur = -1, anims = [], playing = false, started = false, dragging = false;

function sceneAt(x){ let i = DATA.length-1; for(let k=0;k<DATA.length;k++){ if (x < DATA[k].start + DATA[k].dur){ i = k; break; } } return i; }

function render(){
  const i = sceneAt(t), s = DATA[i];
  if (i !== cur){
    if (cur >= 0){ DATA[cur].el.style.display='none'; DATA[cur].btn.removeAttribute('aria-current'); }
    s.el.style.display=''; cur = i; s.btn.setAttribute('aria-current','true');
    anims = s.el.getAnimations({subtree:true});
    $('chip').textContent = s.sec;
  }
  const local = t - s.start;
  for (const a of anims){ a.pause(); a.currentTime = local*1000; }
  for (const tr of s.trav){
    let p = (local - tr.start) / tr.dur;
    if (tr.loop && p >= 0){ const per = tr.dur + tr.gap; p = ((local - tr.start) % per) / tr.dur; }
    if (p < 0 || (tr.loop && p > 1)){ tr.el.style.opacity = 0; continue; }
    p = Math.min(1, p);
    if (!tr.len) tr.len = tr.p.getTotalLength();
    const pt = tr.p.getPointAtLength(p * tr.len);
    tr.el.setAttribute('transform', `translate(${pt.x.toFixed(1)},${pt.y.toFixed(1)})`);
    let op = 1;
    if (tr.rep){ const prev = Math.max(0, ...tr.rep.filter(r=>r<=pt.x)); op = Math.max(.22, 1 - (pt.x - prev)/650); }
    tr.el.style.opacity = op;
  }
  // legenda
  let k = -1; s.st.forEach((st,j)=>{ if (local >= st - .1) k = j; });
  $('cap').textContent = (started && $('capOn').checked && k >= 0) ? s.sent[k] : '';
  if (!dragging) $('scrub').value = t.toFixed(2);
  $('time').textContent = `${fmt(t)} / ${fmt(TOTAL)}`;
}

let last = null;
function loop(ts){
  if (!playing){ last = null; return; }
  if (last !== null) t += (ts - last)/1000;
  last = ts;
  if (t >= TOTAL){ t = TOTAL - .01; setPlaying(false); }
  render();
  if (playing) requestAnimationFrame(loop);
}
function setPlaying(v){
  if (v && !started){ started = true; t = 0; $('bigplay').hidden = true; }
  if (v && t >= TOTAL - .05) t = 0;
  playing = v;
  $('play').textContent = v ? '❚❚ Pausar' : '▶ Play';
  $('play').setAttribute('aria-label', v ? 'Pausar' : 'Reproduzir');
  if (v) requestAnimationFrame(loop); else render();
}
$('play').addEventListener('click', ()=>setPlaying(!playing));
$('bigplay').addEventListener('click', ()=>setPlaying(true));
$('scrub').addEventListener('input', e=>{ dragging = true; if(!started){started=true;$('bigplay').hidden=true;} t = +e.target.value; render(); });
$('scrub').addEventListener('change', ()=>{ dragging = false; });
$('capOn').addEventListener('change', render);
$('fs').addEventListener('click', ()=>{ const el = $('stage'); try{ const r = document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen?.(); r && r.catch && r.catch(()=>{}); }catch(e){} });
document.addEventListener('keydown', e=>{
  if (e.target.closest && e.target.closest('input,button,select,textarea')) return;
  if (e.code === 'Space' || e.key === 'k'){ e.preventDefault(); setPlaying(!playing); }
  if (e.key === 'ArrowRight'){ t = Math.min(TOTAL-.01, t+5); if(!started){started=true;$('bigplay').hidden=true;} render(); }
  if (e.key === 'ArrowLeft'){ t = Math.max(0, t-5); render(); }
});

// quadro de capa: Lia, Theo e o caminho no mapa
const P = DATA[2]; t = P.start + P.st[3] + 4.2; render();
</script>

</body></html>
